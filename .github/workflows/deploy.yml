name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you redeploy without a commit, from the Actions tab.
  workflow_dispatch:

# The Pages deployment needs to write an artifact and claim the environment.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A queued run waits rather than racing the one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Defaults in astro.config target the project subpath. Building the
      # custom domain later means setting BASE_PATH=/ and SITE_URL here.
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
